name: CI & Security Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  security-events: write

jobs:
  validate:
    name: Lint, Test, Security & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Lint Codebase
        run: npm run lint

      - name: Typecheck TypeScript
        run: npm run typecheck

      - name: Synchronize Firestore Rules from Canonical Registry
        run: npm run sync:rules

      - name: Set up Java for Firebase Emulator
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Automated Security, Rules & Emulator Behavioral Tests
        run: npx --yes firebase-tools emulators:exec --only firestore "npm test"

      - name: Secret Scanning (Gitleaks / Token Detection)
        run: |
          echo "Scanning codebase for hardcoded credentials or API tokens..."
          ! grep -rnE "(AIza[0-9A-Za-z-_]{35}|ghp_[0-9A-Za-z]{36}|sk-[0-9A-Za-z]{32,})" . \
            --exclude-dir=node_modules --exclude-dir=.git --exclude="package-lock.json"

      - name: Dependency Vulnerability Audit
        run: npm audit --audit-level=high

      - name: Build Application
        run: npm run build

      - name: Generate Software Bill of Materials (SBOM)
        run: |
          mkdir -p build-artifacts
          npm list --json --all > build-artifacts/sbom.json
